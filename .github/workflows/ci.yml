# Every push and every pull request runs the same four checks that must pass
# before anything reaches staging or production.
#
# No database service is needed: the Postgres-backed tests boot PGlite (Postgres
# compiled to WASM) and apply the committed migrations, so CI exercises the same
# SQL that runs on Neon.

name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # `next build` runs without a database: env validation is lazy (D28), so a
      # broken page still fails here rather than on the deploy.
      - run: pnpm build
